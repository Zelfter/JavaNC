name: Go Foody - CI Pipeline

# Các sự kiện kích hoạt CI
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Quyền tối thiểu cần thiết
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Cài đặt JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Kiểm tra phiên bản Java và Maven
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # 4. Build và chạy tests
      - name: Build with Maven
        run: mvn -B clean verify -DskipTests=false

      # 5. Lưu build artifact
      - name: Upload Quarkus Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gofoody-quarkus-build
          path: target/quarkus-app/
          if-no-files-found: error
          retention-days: 7
