# ============================================================
#  GOFOODY CHATBOT RAG — CẤU HÌNH
#  File MỚI, hoàn toàn tách biệt (KHÔNG sửa application.properties).
# ============================================================
#
#  >>> ĐIỀN LLM API KEY CỦA BẠN VÀO ĐÂY <<<
#  - Mặc định dùng chuẩn OpenAI-compatible (OpenAI, OpenRouter, Azure OpenAI, ...).
#  - Nếu BỎ TRỐNG api.key, chatbot vẫn hoạt động ở chế độ
#    "trả lời từ context sản phẩm" (không gọi LLM). Phần Retrieve vẫn chạy.
#  - Hoặc dùng biến môi trường: CHATBOT_LLM_API_KEY
#
chatbot.llm.api.key=

# Base URL của LLM provider (đuôi /chat/completions sẽ được tự thêm).
#  - OpenAI:        https://api.openai.com/v1
#  - OpenRouter:    https://openrouter.ai/api/v1
#  - Ollama local:  http://localhost:11434/v1
chatbot.llm.base.url=https://api.openai.com/v1

# Tên model (ví dụ: gpt-4o-mini, gpt-3.5-turbo, llama3.1:8b với Ollama, ...)
chatbot.llm.model=gpt-4o-mini

# Số sản phẩm retrieve (yêu cầu 3-5 => mặc định 4)
chatbot.rag.topk=4

# Ngưỡng cosine similarity tối thiểu để coi là liên quan
chatbot.rag.min.score=0.01

# Timeout khi gọi LLM (giây)
chatbot.llm.timeout.seconds=30
