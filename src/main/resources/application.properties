quarkus.http.port=8080
quarkus.application.name=Go Foody - Quarkus

# MySQL Workbench/XAMPP: sửa username/password theo máy bạn
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/gofoody_quarkus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8

# Không dùng Hibernate ORM để tránh lỗi ByteBuddy trên JDK 25 của NetBeans.
quarkus.devservices.enabled=false
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger-ui
