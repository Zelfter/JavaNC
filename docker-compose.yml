services:
  db:
    image: mysql:8.0
    container_name: gofoody-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: gofoody123
      MYSQL_DATABASE: gofoody_quarkus
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: gofoody-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_USERNAME: root
      DB_PASSWORD: gofoody123
      DB_URL: jdbc:mysql://db:3306/gofoody_quarkus
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
